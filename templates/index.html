<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>次発電車リアルタイム案内</title>
    
    <link id="favicon" rel="icon" href="{{ url_for('static', filename='jk14.png') }}" type="image/png">

    <style>
      /* ==========================================
         共通・ベーススタイル
         ========================================== */
      body { font-family: sans-serif; background: #f4f4f9; padding: 10px; color: #333; margin: 0; }
      .header-area { text-align: center; margin-bottom: 15px; }
      
      /* タイトルまわり */
      h1 { margin: 0 0 6px 0; color: #222; font-size: 1.8em; }
      
      .sub-header-row { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        gap: 12px; 
        margin-bottom: 8px; 
        flex-wrap: wrap; 
      }
      
      /* 路線切り替えボタンエリア */
      .station-selector {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      /* ボタン内のアイコン（JRを大きめに調整） */
      .station-inline-icon {
        height: 1.8em;
        width: auto;
        vertical-align: middle;
        margin-right: 6px;
      }

      /* 路線選択ボタン基本スタイル */
      .line-btn {
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        border: 1px solid #aaa;
        border-radius: 6px;
        font-weight: bold;
        font-size: 1.05em;
        cursor: pointer;
        background-color: #d6d6d6;
        color: #444;
        transition: all 0.2s ease;
      }
      .line-btn:hover {
        opacity: 0.9;
      }

      /* JR新子安駅：選択時（背景薄水） */
      .line-btn.jr.active {
        background-color: #e0f7fa;
        border-color: #00bcd4;
        color: #006064;
      }

      /* 京急新子安駅：選択時（背景薄赤） */
      .line-btn.keikyu.active {
        background-color: #ffebee;
        border-color: #ef5350;
        color: #c62828;
      }

      .day-type-badge { background: #ffc107; color: #333; padding: 3px 12px; border-radius: 12px; font-weight: bold; font-size: 1.1em; }
      
      .date-display { font-size: 1.15em; color: #444; margin-bottom: 6px; font-weight: bold; }
      .time-display { font-size: 2.8em; font-weight: bold; color: #007bff; letter-spacing: 2px; margin-bottom: 10px; }
      
      /* 徒歩時間変更エリア */
      .walk-time-selector {
        margin-top: 5px;
        font-size: 1.05em;
        font-weight: bold;
        color: #444;
      }
      .walk-time-selector select {
        font-size: 1.0em;
        padding: 4px 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
        font-weight: bold;
        background: #fff;
        color: #333;
      }

      .container { 
        display: flex; 
        flex-direction: column; 
        align-items: center;
        gap: 12px; 
        max-width: 100%; 
        margin: 0 auto; 
        box-sizing: border-box;
      }
      
      .card { 
        background: #fff; 
        padding: 15px; 
        border-radius: 8px; 
        box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        width: 100%; 
        box-sizing: border-box;
        text-align: center;
      }
      
      h2 { border-bottom: 2px solid #007bff; padding-bottom: 4px; color: #007bff; margin-top: 0; font-size: 1.4em; }
      .departure-info { padding-bottom: 12px; border-bottom: 1px solid #eee; font-size: 1.0em; color: #666; text-align: center; font-weight: bold; }

      /* 電車情報の行 */
      .train-item { display: flex; align-items: center; justify-content: flex-start; border-bottom: 1px solid #eee; padding: 12px 4px; }
      .train-label { font-size: 1.2em; font-weight: bold; color: #333; width: 65px; flex-shrink: 0; text-align: center; background: #e9ecef; padding: 6px 0; border-radius: 5px; margin-right: 10px; }
      .train-details { text-align: left; width: 100%; }

      /* 種別バッジ */
      .train-badge {
        display: inline-block;
        padding: 4px 14px;
        border-radius: 5px;
        font-weight: bold;
        color: #fff;
        text-align: center;
        font-size: 1.25em;
      }
      .type-rapid { background-color: #e83e8c; }  /* JR 快速 */
      .type-local { background-color: #17a2b8; }  /* 普通 */
      .type-ltdexp { background-color: #d9534f; } /* 快特・特急 */

      .train-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
      
      .train-text-main { font-size: 1.15em; font-weight: bold; } 
      .countdown { color: #d9534f; font-weight: bold; font-size: 1.0em; } 

      .note-text {
        text-align: center;
        font-size: 0.9em;
        color: #666;
        margin-top: 10px;
        font-weight: bold;
      }

      /* ==========================================
         スマホ版向け個別調整（コンパクト化）
         ========================================== */
      @media screen and (max-width: 1023px) {
        body { padding: 8px; }
        h1 { font-size: 1.2em; }
        .line-btn { font-size: 0.85em; padding: 4px 8px; }
        .station-inline-icon { height: 1.5em; }
        .day-type-badge { font-size: 0.85em; padding: 2px 8px; }
        .date-display { font-size: 0.9em; }
        .time-display { font-size: 1.8em; margin: 4px 0; }
        .walk-time-selector { font-size: 0.85em; }
        .walk-time-selector select { font-size: 0.85em; padding: 2px 4px; }
        h2 { font-size: 1.05em; }
        .departure-info { padding-bottom: 8px; font-size: 0.8em; }
        .train-label { font-size: 0.85em; width: 45px; padding: 3px 0; margin-right: 6px; }
        .train-badge { font-size: 0.9em; padding: 2px 8px; }
        .train-text-main { font-size: 0.9em; font-weight: bold; }
        .countdown { font-size: 0.8em; }
        .train-item { padding: 8px 2px; }
        .card { padding: 10px; }
      }

      /* ==========================================
         PC版向け個別調整
         ========================================== */
      @media screen and (min-width: 1024px) {
        body { padding: 15px; }
        .container { 
          flex-direction: row; 
          justify-content: center; 
          align-items: flex-start;
          max-width: 1300px; 
        }
        .card { 
          width: 48%; 
          min-width: 480px; 
          padding: 18px;
        }
        h1 { font-size: 2.1em; }
        .line-btn { font-size: 1.1em; padding: 6px 14px; }
        .day-type-badge { font-size: 1.15em; padding: 3px 12px; }
        .time-display { font-size: 3.0em; }
        .walk-time-selector { font-size: 1.1em; }
        h2 { font-size: 1.5em; }
        .departure-info { padding-bottom: 12px; font-size: 1.05em; font-weight: bold; }
        .train-label { font-size: 1.2em; width: 70px; padding: 6px 0; }
        .train-badge { font-size: 1.28em; padding: 4px 16px; }
        .train-text-main { font-size: 1.2em; font-weight: bold; }
        .countdown { font-size: 1.1em; }
      }
    </style>
    <script>
      let currentData = { up: [], down: [], dayType: "" };
      let lastFetchedTime = 0;
      let currentLine = 'jr';

      const ICON_URL_JR = "{{ url_for('static', filename='jk14.png') }}";
      const ICON_URL_KEIKYU = "{{ url_for('static', filename='kk32.avif') }}";

      function switchLine(line) {
        if (currentLine === line) return;
        currentLine = line;

        document.getElementById('btn-jr').classList.toggle('active', line === 'jr');
        document.getElementById('btn-keikyu').classList.toggle('active', line === 'keikyu');
        document.getElementById('favicon').href = (line === 'keikyu') ? ICON_URL_KEIKYU : ICON_URL_JR;

        if (line === 'keikyu') {
          document.getElementById('up-title').innerText = "上り（川崎・蒲田・泉岳寺方面）";
          document.getElementById('down-title').innerText = "下り（横浜・上大岡・浦賀方面）";
          document.getElementById('keikyu-note').style.display = "block";
        } else {
          document.getElementById('up-title').innerText = "上り（川崎・東京・上野・大宮方面）";
          document.getElementById('down-title').innerText = "下り（横浜・桜木町・関内・大船方面）";
          document.getElementById('keikyu-note').style.display = "none";
        }

        fetchTrainData();
      }

      function fetchTrainData() {
        const walkMin = parseInt(document.getElementById('walk-time-select').value, 10);
        
        // 日付をまたぐ深夜帯（0時〜3時未満）の場合、API側へ「前日のデータ」を要求するためのパラメータや日付を付与するなどの拡張ができるよう、現在時刻を元に取得
        fetch(`/api/trains?walk=${walkMin}&line=${currentLine}`)
          .then(response => response.json())
          .then(data => {
            currentData = data;
            lastFetchedTime = Date.now();
            render();
          })
          .catch(err => { console.error(err); });
      }

      function onWalkTimeChanged() {
        fetchTrainData();
      }

      function render() {
        let realNow = new Date();
        
        // ダイヤ計算用の日付（深夜3時までは前日扱い）
        let trainDateObj = new Date(realNow.getTime());
        if (realNow.getHours() < 3) {
          trainDateObj.setDate(trainDateObj.getDate() - 1);
        }
        
        let yearWestern = trainDateObj.getFullYear();
        let month = trainDateObj.getMonth() + 1;
        let day = trainDateObj.getDate();
        let weekdays = ['日', '月', '火', '水', '木', '金', '土'];
        let weekdayStr = weekdays[trainDateObj.getDay()];

        let isNewYear = (month === 12 && (day === 30 || day === 31)) || (month === 1 && (day >= 1 && day <= 3));
        
        let dateSuffix = `（${weekdayStr}）`;
        if (isNewYear) {
          dateSuffix = ` ${weekdayStr}曜日（年末年始期間）`;
        } else if (currentData.isHoliday) {
          let holidayName = currentData.holidayName || "祝日";
          dateSuffix = ` ${weekdayStr}曜日・祝日（${holidayName}）`;
        } else {
          dateSuffix = ` ${weekdayStr}曜日`;
        }

        let fullDateString = `${yearWestern}年${month}月${day}日` + dateSuffix;

        let timeStr = String(realNow.getHours()).padStart(2, '0') + ":" + 
                    String(realNow.getMinutes()).padStart(2, '0') + ":" + 
                    String(realNow.getSeconds()).padStart(2, '0');

        document.getElementById('day-type-box').innerText = currentData.dayType || "--ダイヤ";
        document.getElementById('date-box').innerText = fullDateString;
        document.getElementById('time-box').innerText = timeStr;
        
        const selectedWalkVal = document.getElementById('walk-time-select').value;
        const departureInfoHtml = `出発地: 浅野学園｜徒歩: ${selectedWalkVal}分`;
        document.getElementById('up-departure-info').innerHTML = departureInfoHtml;
        document.getElementById('down-departure-info').innerHTML = departureInfoHtml;

        document.getElementById('up-content').innerHTML = formatTrains(currentData.up, realNow);
        document.getElementById('down-content').innerHTML = formatTrains(currentData.down, realNow);

        if (Date.now() - lastFetchedTime > 5000) {
          fetchTrainData();
        }
      }

      function formatTrains(trains, realNow) {
        if (!trains || trains.length === 0) {
          return "<p style='text-align:center; color:#777; font-size:1.1em;'>本日の残りの電車はありません</p>";
        }

        const walkSec = parseInt(document.getElementById('walk-time-select').value, 10) * 60;
        let html = "";
        const labels = ["先発", "次発"];
        
        let currentHour = realNow.getHours();
        let currentMin = realNow.getMinutes();
        let currentSec = realNow.getSeconds();
        let currentMs = realNow.getMilliseconds();

        let currentPreciseSec = currentHour * 3600 + currentMin * 60 + currentSec + currentMs / 1000;

        // 深夜帯（0時〜3時未満）なら現在時刻に24時間分を足す
        let isLateNight = (currentHour >= 0 && currentHour < 3);
        if (isLateNight) {
          currentPreciseSec += 86400;
        }

        let validCount = 0;
        for (let i = 0; i < trains.length; i++) {
          let t = trains[i];
          
          let timeParts = t.time.split(':');
          let trainHour = parseInt(timeParts[0], 10);
          let trainMin = parseInt(timeParts[1], 10);
          let trainSec = trainHour * 3600 + trainMin * 60;
          
          // ★重要：現在が23時台で、電車の時間が0時〜3時台なら、翌日の時間（+86400秒）として扱う
          if (currentHour === 23 && trainHour >= 0 && trainHour < 3) {
            trainSec += 86400;
          }
          // もし現在がすでに深夜帯（0時〜3時未満）で、電車の時間も深夜帯の場合も同様に補正
          else if (isLateNight && trainHour < 3) {
            trainSec += 86400;
          }

          let leavePreciseSec = trainSec - walkSec;
          let remainingPrecise = leavePreciseSec - currentPreciseSec;
          
          if (remainingPrecise <= 0) continue;

          let totalRemainingSecInt = Math.ceil(remainingPrecise) - 1;
          if (totalRemainingSecInt < 0) continue;

          let badgeClass = "type-local";
          if (t.type === "快速") {
            badgeClass = "type-rapid";
          } else if (t.type === "快特" || t.type === "特急") {
            badgeClass = "type-ltdexp";
          }

          let destName = t.destination;
          if (destName === "羽田空港第１・第２ターミナル") {
            destName = "羽田空港";
          }

          let labelText = labels[validCount] || "次発";
          validCount++;
          
          let m = Math.floor(totalRemainingSecInt / 60);
          let s = totalRemainingSecInt % 60;
          let countStr = m + "分" + String(s).padStart(2, '0') + "秒";

          let leaveTimeShort = t.leaveTime ? t.leaveTime.substring(0, 5) : "";

          html += `
            <div class="train-item">
              <div class="train-label">${labelText}</div>
              <div class="train-details">
                <div class="train-row">
                  <span class="train-badge ${badgeClass}">${t.type}</span>
                  <span class="train-text-main">${destName}行｜${t.time}発｜${t.cars}両</span>
                </div>
                <div class="countdown">残り時間: ${countStr}（リミット: ${leaveTimeShort}）</div>
              </div>
            </div>
          `;
        }
        return html === "" ? "<p style='text-align:center; color:#777; font-size:1.1em;'>本日の残りの電車はありません</p>" : html;
      }

      let lastRenderedSecond = -1;

      function highPrecisionLoop() {
        let now = new Date();
        let currentSecond = now.getSeconds();

        if (currentSecond !== lastRenderedSecond) {
          render();
          lastRenderedSecond = currentSecond;
        }

        requestAnimationFrame(highPrecisionLoop);
      }

      window.onload = function() {
        fetchTrainData();
        requestAnimationFrame(highPrecisionLoop);
      };
    </script>
  </head>
  <body>
    <div class="header-area">
      <h1>次発電車リアルタイム案内</h1>
      <div class="sub-header-row">
        <div class="station-selector">
          <button id="btn-jr" class="line-btn jr active" onclick="switchLine('jr')">
            <img src="{{ url_for('static', filename='jk14.png') }}" alt="JR icon" class="station-inline-icon">ＪＲ新子安駅
          </button>
          <button id="btn-keikyu" class="line-btn keikyu" onclick="switchLine('keikyu')">
            <img src="{{ url_for('static', filename='kk32.avif') }}" alt="Keikyu icon" class="station-inline-icon">京急新子安駅
          </button>
        </div>
        <span id="day-type-box" class="day-type-badge">--ダイヤ</span>
      </div>
      <div id="date-box" class="date-display">読み込み中...</div>
      <div id="time-box" class="time-display">--:--:--</div>
      
      <div class="walk-time-selector">
        <label for="walk-time-select">徒歩: </label>
        <select id="walk-time-select" onchange="onWalkTimeChanged()">
          <option value="0">0分=時刻表</option>
          <option value="1">1分</option>
          <option value="2">2分</option>
          <option value="3">3分</option>
          <option value="4">4分</option>
          <option value="5">5分</option>
          <option value="6">6分</option>
          <option value="7">7分</option>
          <option value="8">8分</option>
          <option value="9">9分</option>
          <option value="10">10分</option>
          <option value="11">11分</option>
          <option value="12" selected>12分</option>
          <option value="13">13分</option>
          <option value="14">14分</option>
          <option value="15">15分</option>
          <option value="16">16分</option>
          <option value="17">17分</option>
          <option value="18">18分</option>
          <option value="19">19分</option>
          <option value="20">20分</option>
          <option value="21">21分</option>
          <option value="22">22分</option>
          <option value="23">23分</option>
          <option value="24">24分</option>
          <option value="25">25分</option>
          <option value="26">26分</option>
          <option value="27">27分</option>
          <option value="28">28分</option>
          <option value="29">29分</option>
          <option value="30">30分</option>
        </select>
      </div>
    </div>

    <div class="container">
      <div class="card">
        <h2 id="up-title">上り（川崎・東京・上野・大宮方面）</h2>
        <div id="up-departure-info" class="departure-info">出発地: 浅野学園｜徒歩: 12分</div>
        <div id="up-content">読み込み中...</div>
      </div>
      
      <div class="card">
        <h2 id="down-title">下り（横浜・桜木町・関内・大船方面）</h2>
        <div id="down-departure-info" class="departure-info">出発地: 浅野学園｜徒歩: 12分</div>
        <div id="down-content">読み込み中...</div>
      </div>
    </div>

    <div id="keikyu-note" class="note-text" style="display: none;">
      ※羽田空港＝羽田空港第１・第２ターミナル
    </div>
  </body>
</html>
